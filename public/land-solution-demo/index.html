<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/land-solution-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Land Solution - Real Estate, Land Area Calculation, Civil Engineering & 2D/3D Architectural Blueprints">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Land Solution">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Land Solution | जग्गा नापी तथा थ्रीडी घर नक्सा</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .loading-bar-bg {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .loading-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #38BDF8);
      border-radius: 4px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "canvaskit/",
      canvasKitMaximumSurfaces: 2
    };
  </script>
</head>
<body>
  <div id="loading-container">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Land Solution Logo" onerror="this.style.display='none'">
    <div class="loading-title">Land Solution</div>
    <div class="loading-sub">जग्गा नापी, थ्रीडी घर नक्सा तथा आर्किटेक्चरल प्रणाली</div>
    <div class="loading-bar-bg">
      <div class="loading-bar-fill"></div>
    </div>
    <div id="loading-status" style="margin-top: 16px; font-size: 12px; color: #94A3B8; text-align: center; max-width: 280px; min-height: 36px; line-height: 1.5;">
      इन्जिन तथा डेटाबेस लोड हुँदैछ...
    </div>
  </div>

  <script>
    (function () {
      // 1. Safely unregister any legacy service workers without reloading
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister().catch(function () {});
          }
        }).catch(function () {});
      }

      var dismissed = false;
      function dismissLoader() {
        if (dismissed) return;
        dismissed = true;
        var loader = document.getElementById('loading-container');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function () {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 400);
        }
      }

      // Event 1: Normal Flutter first frame event
      window.addEventListener('flutter-first-frame', dismissLoader);

      // Event 2: DOM MutationObserver to catch Flutter UI mount
      if (window.MutationObserver) {
        var observer = new MutationObserver(function () {
          var flutterHost = document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas');
          if (flutterHost) {
            setTimeout(dismissLoader, 200);
            observer.disconnect();
          }
        });
        if (document.body) {
          observer.observe(document.body, { childList: true, subtree: true });
        }
      }

      // Progressive loading feedback (No premature hiding!)
      var statusEl = document.getElementById('loading-status');
      setTimeout(function () {
        if (!dismissed && statusEl) {
          statusEl.innerText = 'क्यानभास इन्जिन (CanvasKit) लोड हुँदैछ...';
        }
      }, 3500);

      setTimeout(function () {
        if (!dismissed && statusEl) {
          statusEl.innerText = 'थ्रीडी नक्सा तथा स्थानीय तह डेटा तयार गरिँदैछ...';
        }
      }, 7000);

      setTimeout(function () {
        if (!dismissed && statusEl) {
          statusEl.innerHTML = 'इन्टरनेट ढिलो भएको हुन सक्छ...<br><a href="/land-solution-demo/index.html" target="_top" style="color: #38BDF8; font-weight: bold; text-decoration: underline; margin-top: 6px; display: inline-block;">सफारीमा सिधै खोल्नुहोस् ↗</a>';
        }
      }, 14000);

      // Error catching
      window.addEventListener('error', function (e) {
        console.error("Global Loader Error:", e.error || e.message);
        if (statusEl && !dismissed) {
          statusEl.innerHTML = '<span style="color:#F87171">लोड हुन समस्या भयो।</span><br><a href="/land-solution-demo/index.html" target="_top" style="color:#38BDF8;font-weight:bold;text-decoration:underline;margin-top:6px;display:inline-block">यहाँ ट्याप गरी सिधै खोल्नुहोस् ↗</a>';
        }
      });


      // 4. Safari iOS Geolocation Permissions API Compatibility Shim
      window._locationGranted = false;
      if (navigator.permissions && navigator.permissions.query) {
        var origQuery = navigator.permissions.query.bind(navigator.permissions);
        navigator.permissions.query = function (param) {
          try {
            return origQuery(param).then(function (res) {
              if (res && res.state === 'granted') window._locationGranted = true;
              return res;
            }).catch(function () {
              return { state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null };
            });
          } catch (e) {
            return Promise.resolve({ state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null });
          }
        };
      } else if (!navigator.permissions) {
        navigator.permissions = {
          query: function () {
            return Promise.resolve({ state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null });
          }
        };
      }

      // 5. iOS Motion & Compass (DeviceOrientation) Permission Request
      function enableIosSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (state) {
            if (state === 'granted') {
              window._iosSensorsEnabled = true;
            }
          }).catch(function () {});
        }
      }
      window.addEventListener('click', enableIosSensors, { once: true });
      window.addEventListener('touchstart', enableIosSensors, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
