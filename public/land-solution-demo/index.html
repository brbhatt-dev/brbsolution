<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Land Solution | जग्गा नापी तथा थ्रीडी घर नक्सा</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 28px;
    }
    .loading-bar-bg {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .loading-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #38BDF8);
      border-radius: 4px;
      animation: indeterminate 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
  <script>
    window.flutterConfiguration = {
      canvasKitBaseUrl: "canvaskit/",
      canvasKitMaximumSurfaces: 2
    };
  </script>
</head>
<body>
  <div id="loading-container">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Land Solution Logo" onerror="this.style.display='none'">
    <div class="loading-title">Land Solution</div>
    <div class="loading-sub">जग्गा नापी, थ्रीडी घर नक्सा तथा आर्किटेक्चरल प्रणाली</div>
    <div class="loading-bar-bg">
      <div class="loading-bar-fill"></div>
    </div>
    <div id="loading-status" style="margin-top: 16px; font-size: 12px; color: #94A3B8; text-align: center; max-width: 280px; min-height: 36px; line-height: 1.5;">
      इन्जिन तथा डेटाबेस लोड हुँदैछ...
    </div>
    <div id="loading-actions" style="display:none; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center">
      <button type="button" onclick="location.reload()" style="min-height:48px;padding:0 18px;background:#1e293b;color:white;border:1px solid #475569;border-radius:12px;cursor:pointer">Retry</button>
      <a href="/land-solution" target="_top" style="min-height:48px;display:flex;align-items:center;padding:0 18px;color:#7dd3fc">Website मा खोल्नुहोस्</a>
    </div>
  </div>

  <script>
    (function () {
      // 1. Safely unregister any legacy service workers without reloading
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            if (new URL(registrations[i].scope).pathname.startsWith('/land-solution-demo/')) {
              registrations[i].unregister().catch(function () {});
            }
          }
        }).catch(function () {});
      }

      var dismissed = false;
      var statusEl = document.getElementById('loading-status');
      var timeout;
      window.landSolutionBootStage = function (phase) {
        var labels = {download:'App डाउनलोड हुँदैछ…',engine:'चित्र र नक्सा इन्जिन तयार हुँदैछ…',application:'App सुरु हुँदैछ…',error:'लोड हुन समस्या भयो। इन्टरनेट जाँचेर Retry गर्नुहोस्।'};
        if (!dismissed && statusEl) statusEl.textContent = labels[phase] || labels.download;
        if (phase === 'error' && !dismissed) document.getElementById('loading-actions').style.display='flex';
        if (window.parent !== window) window.parent.postMessage(JSON.stringify({type:'land-solution-status',phase:phase}),location.origin);
      };
      function dismissLoader() {
        if (dismissed) return;
        dismissed = true; clearTimeout(timeout);
        var loader = document.getElementById('loading-container');
        if (loader) loader.remove();
      }
      // Ready is emitted by the mounted Flutter application, not by the mere presence of a canvas.
      window.addEventListener('land-solution-app-ready',dismissLoader);
      window.landSolutionBootStage('download');
      timeout = setTimeout(function () {
        if (!dismissed) {
          if (statusEl) statusEl.textContent='लोड हुन धेरै समय लाग्यो। इन्टरनेट जाँचेर फेरि प्रयास गर्नुहोस्।';
          document.getElementById('loading-actions').style.display='flex';
        }
      },45000);
      window.addEventListener('error',function () { if (!dismissed) window.landSolutionBootStage('error'); });
      window.addEventListener('unhandledrejection',function () { if (!dismissed) window.landSolutionBootStage('error'); });
      window.addEventListener('offline',function () {
        if (!dismissed) { window.landSolutionBootStage('error'); if (statusEl) statusEl.textContent='इन्टरनेट जोडिएको छैन। जोडिएपछि Retry गर्नुहोस्।'; }
      });

      // 4. Safari iOS Geolocation Permissions API Compatibility Shim
      window._locationGranted = false;
      if (navigator.permissions && navigator.permissions.query) {
        var origQuery = navigator.permissions.query.bind(navigator.permissions);
        navigator.permissions.query = function (param) {
          try {
            return origQuery(param).then(function (res) {
              if (res && res.state === 'granted') window._locationGranted = true;
              return res;
            }).catch(function () {
              return { state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null };
            });
          } catch (e) {
            return Promise.resolve({ state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null });
          }
        };
      } else if (!navigator.permissions) {
        navigator.permissions = {
          query: function () {
            return Promise.resolve({ state: window._locationGranted ? 'granted' : 'prompt', addEventListener: function () {}, onchange: null });
          }
        };
      }

      // 5. iOS Motion & Compass (DeviceOrientation) Permission Request
      function enableIosSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (state) {
            if (state === 'granted') {
              window._iosSensorsEnabled = true;
            }
          }).catch(function () {});
        }
      }
      window.addEventListener('click', enableIosSensors, { once: true });
      window.addEventListener('touchstart', enableIosSensors, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js?v=2.8.19-2314-r17" async></script>
</body>
</html>
